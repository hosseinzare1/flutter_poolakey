group 'ir.cafebazaar.flutter_poolakey'
version '2.2.0+1.0.0'

ext.poolakey_version = "2.2.0"

allprojects {
    repositories {
        mavenCentral()
        maven { url "https://jitpack.io" }
        google()
    }
}

apply plugin: 'com.android.library'

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
boolean hasBuiltInKotlinSupport = agpMajor >= 9

def builtInKotlinProperty = findProperty('android.builtInKotlin')
boolean isBuiltInKotlinEnabled = builtInKotlinProperty == null ||
        builtInKotlinProperty.toString().toBoolean()

boolean shouldApplyKotlinGradlePlugin = !hasBuiltInKotlinSupport || !isBuiltInKotlinEnabled

if (shouldApplyKotlinGradlePlugin) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'ir.cafebazaar.flutter_poolakey'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 16
        versionCode 2002001000
        versionName "2.2.0+1.0.0"
    }

    buildTypes {
        debug {
            buildConfigField "String", "POOLAKEY_VERSION", '"' + poolakey_version + '"'
        }
        release {
            buildConfigField "String", "POOLAKEY_VERSION", '"' + poolakey_version + '"'
        }
    }
}

if (shouldApplyKotlinGradlePlugin) {
    android {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }
} else {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}

dependencies {
    implementation "com.github.cafebazaar.Poolakey:poolakey:$poolakey_version"
}
